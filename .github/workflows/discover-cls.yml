name: Discover NCERT books for Class 9 and 11

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - letter: i
            num: 9
          - letter: k
            num: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/discover_cls.py ${{ matrix.letter }} ${{ matrix.num }}
      - name: Commit result
        if: always()
        run: |
          f=scripts/discovery_class${{ matrix.num }}.json
          if [ -n "$(git status --porcelain $f)" ]; then
            git config user.name "graphpaper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add $f
            git commit -m "Save Class ${{ matrix.num }} discovery"
            for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push && break; sleep $((RANDOM % 10 + 3)); done
          fi
