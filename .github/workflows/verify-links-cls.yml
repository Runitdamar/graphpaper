name: Verify links for one class

on:
  workflow_dispatch:
    inputs:
      num:
        description: "Class number (books_<N>.json must exist)"
        required: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/verify_links_cls.py "${{ inputs.num }}"
      - name: Commit result
        if: always()
        run: |
          f=scripts/class${{ inputs.num }}_links.json
          if [ -n "$(git status --porcelain $f)" ]; then
            git config user.name "graphpaper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add $f
            git commit -m "Save Class ${{ inputs.num }} link check"
            for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push && break; sleep $((RANDOM % 10 + 3)); done
          fi
