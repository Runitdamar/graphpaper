name: Probe NCERT chapter files

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/probe_ncert.py
      - name: Commit probe result
        if: always()
        run: |
          if [ -n "$(git status --porcelain scripts/ncert_probe.json)" ]; then
            git config user.name "graphpaper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/ncert_probe.json
            git commit -m "Save NCERT probe result"
            git push
          fi
