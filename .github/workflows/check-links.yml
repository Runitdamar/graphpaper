name: Check links

# Opens every official link the site shows (NCERT PDFs and ZIPs, CBSE syllabus, papers,
# question bank, notices) and lists the ones that fail in the run summary.
# It does not change any file in the repository.

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_links.py
      - uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link_report.json
      - name: Save the report on the qa-reports branch
        run: |
          python - <<'PY'
          import json
          d = json.load(open("link_report.json"))
          lines = ["# Link check: %d links, %d problem(s)" % (d["total"], d["failed"]), ""]
          lines += ["- %s | %s | %s" % (b["what"], b.get("error") or b.get("status"), b["url"]) for b in d["failures"]]
          open("/tmp/links.md", "w").write("\n".join(lines) + "\n")
          PY
          git config user.name "graphpaper-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin qa-reports || true
          git checkout -B qa-reports $(git rev-parse --verify -q origin/qa-reports || echo HEAD)
          mkdir -p reports && cp /tmp/links.md reports/links.md
          git add reports/links.md
          git commit -m "Link report" || true
          git push origin qa-reports
