name: Build feed
on:
  push:
    branches: [main]
    paths: ["updates.json", "scripts/build_feed.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_feed.py
      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet || (git commit -m "Update feed" && git pull -q --rebase && git push)
