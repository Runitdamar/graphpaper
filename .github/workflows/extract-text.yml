name: Extract notice text

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/extract_pdf_text.py
      - name: Commit extracted text
        if: always()
        run: |
          if [ -n "$(git status --porcelain scripts/pdf_text.json)" ]; then
            git config user.name "graphpaper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/pdf_text.json
            git commit -m "Save extracted notice text"
            git push
          fi
