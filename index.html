h2{font-weight:600;font-size:30px;margin:0 0 20px}

.wrap{max-width:1200px;margin:0 auto;padding:0 32px;width:100%;box-sizing:border-box}
.sec{padding-bottom:56px}
.crumb{font-size:15px;color:var(--mut);margin-bottom:20px}
.crumb b{color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;color:var(--ink)}
.f{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:8px 18px;min-height:44px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink)}
.f[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;padding:10px 24px;font-weight:700;font-size:16px;border:2px solid var(--ink);cursor:pointer;color:var(--ink);background:var(--card)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:hover{text-decoration:none}
.card{background:var(--card);border:2px solid var(--ink);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 var(--sh,var(--a1))}
.card h3{font-size:21px;line-height:1.25;overflow-wrap:anywhere}
.card.sm{border-radius:24px;padding:20px;gap:10px;box-shadow:0 5px 0 var(--sh,var(--a1))}
.card.sm h3{font-size:19px}
.meta{color:var(--mut);font-size:15px}
.more{font-weight:700;margin-top:auto}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}
.bq{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:20px;text-align:left;color:var(--ink);font-size:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 5px 0 var(--sh,var(--a1))}
.bq:hover{transform:translateY(-2px);text-decoration:none}
.bq .ic{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);margin-bottom:6px}
.bq b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px}
.tile{flex:none;width:112px;height:112px;border-radius:32px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:60px;box-shadow:0 6px 0 var(--ink)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:28px;margin-bottom:36px}
.head p{margin:8px 0 0;color:var(--mut);max-width:560px}
.search{display:flex;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:8px;max-width:520px;box-shadow:0 6px 0 var(--a1)}
.search input{flex:1 1 160px;min-width:0;border:0;outline:0;background:transparent;font-size:17px;padding:10px 16px;color:var(--ink)}
.search:focus-within{outline:3px solid var(--ink);outline-offset:3px}
.search .go{background:var(--a2);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:10px 24px;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.grid-paper{background-color:var(--card);background-image:linear-gradient(var(--gl) 1px,transparent 1px),linear-gradient(90deg,var(--gl) 1px,transparent 1px);background-size:28px 28px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--a3);border-radius:16px;padding:8px 14px;font-size:14px;font-weight:700}
.info{background:var(--card);border:2px solid var(--ink);border-radius:24px;padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.info small{display:block;font-size:13px;font-weight:700;color:var(--mut)}
.info div div{font-weight:700;overflow-wrap:anywhere}
.book{background:var(--card);border:2px solid var(--ink);border-radius:24px;box-shadow:0 5px 0 var(--sh,var(--a1));overflow:hidden}
.book summary{cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px}
.book .bi{flex:none;width:44px;height:44px;border-radius:14px;border:2px solid var(--ink)}
.book .bt{flex:1;min-width:0}
.book .bt b{display:block;font-family:'Fredoka',sans-serif;font-weight:500;font-size:20px}
.book .bt span{color:var(--mut);font-size:14px}
.book .car{transition:transform .2s}
.book[open] .car{transform:rotate(90deg)}
.chs{border-top:2px solid var(--gl);padding:6px 18px 16px}
.chr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-bottom:2px solid var(--gl)}
.chr:last-of-type{border-bottom:0}
.chr .no{color:var(--mut);font-size:13px;font-weight:700;min-width:4.4em}
.chr .tt{overflow-wrap:anywhere}
.chr small{grid-column:2/4;color:var(--mut);font-size:13px;margin-top:-6px}
.chr.na .tt{color:var(--mut)}
.hr{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:48px;align-items:center;padding-top:40px;padding-bottom:56px}

#view:focus{outline:none}
.menu{left:0}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ---------- router ---------- */
function parse(){
  var h = location.hash.replace(/^#\/?/, ""), qi = h.indexOf("?");
  var path = (qi > -1 ? h.slice(0, qi) : h).split("/");
  return {name: path[0] || "", arg: decodeURIComponent(path[1] || ""), q: new URLSearchParams(qi > -1 ? h.slice(qi + 1) : "")};
}
function applyClass(){
  $("#app").dataset.c = ST.cls;
  $("#clsnum").textContent = ST.cls;
  D.querySelectorAll("#cgrid button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.v === ST.cls ? "true" : "false"); });
}
function route(keepScroll){
  var r = parse(), name = r.name;
  if (!name) name = ST.cls ? "home" : "welcome";
  if (!VIEWS[name]) name = "home";
  if (!keepScroll){
    if (name !== "updates" || !ST.fromSearch){ if (name === "updates" || ST.navFrom === "updates"){ ST.type = "all"; ST.q = ""; ST.ub = "all"; } }
    if (name !== "books"){ ST.bq = ""; ST.bsub = "All"; }
    ST.fromSearch = false; ST.navFrom = name;
  }
  $("#topnav").hidden = $("#foot").hidden = (name === "welcome");
  if (name !== "welcome") applyClass();
  $("#view").innerHTML = VIEWS[name](r);
  var d = $("#clsmenu"); if (d) d.open = false;
  document.title = (name === "notice" ? (function(){ var t = $("#pg"); return (t && t.textContent ? t.textContent.slice(0, 80) + " | GraphPaper" : TITLES.notice); })() : (name === "board" ? (BOARDS[r.arg] ? r.arg : "CBSE") + " | GraphPaper" : TITLES[name]));
  if (!keepScroll){
    var s = r.q.get("s"), tgt = s && D.getElementById(s);
    if (tgt) tgt.scrollIntoView({behavior: "smooth"}); else window.scrollTo(0, 0);
    var pg = $("#pg"); if (pg && !tgt) pg.focus({preventScroll:true});
  }
}
function setClass(v){
  ST.cls = v; ST.wc = v;
  try { localStorage.setItem("gp-class", v); } catch(e){}
  applyClass();
}

  var t = e.target; if (t.classList && t.classList.contains("book") && !ST.bq) ST.bopen[t.dataset.code] = t.open;
}, true);
window.addEventListener("hashchange", function(){ route(); });

/* ---------- data ---------- */
applyClass();
route();
fetch("updates.json", {cache: "no-store"}).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(d){
  ST.items = (Array.isArray(d) ? d : []).filter(function(x){ return x && x.status === "approved" && !x.sample; }).sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
}).catch(function(){}).then(function(){ ST.loaded = true; route(true); });
</script>
